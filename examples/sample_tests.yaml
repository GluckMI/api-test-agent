# API 接口自动化测试示例 - JSONPlaceholder REST API

# 测试场景 1: 获取所有文章
- name: "获取所有文章"
  description: "测试 GET /posts 接口，验证返回文章列表"
  
  steps:
    - name: "获取文章列表"
      method: GET
      endpoint: "https://jsonplaceholder.typicode.com/posts"
      
      assertions:
        - type: status_code
          expected: 200
          name: "HTTP 状态码检查"
        
        - type: response_time
          max: 5.0
          name: "响应时间检查"
        
        - type: type_check
          path: "$"
          expected_type: list
          name: "响应类型为数组"
        
        - type: length
          path: "$"
          expected: 100
          name: "文章数量为 100"

    # 验证第一条文章的字段
    - name: "验证文章结构"
      method: GET
      endpoint: "https://jsonplaceholder.typicode.com/posts/1"
      
      assertions:
        - type: status_code
          expected: 200
        
        - type: contains_key
          key: "userId"
          path: "$"
          name: "包含 userId 字段"
        
        - type: contains_key
          key: "id"
          path: "$"
          name: "包含 id 字段"
        
        - type: contains_key
          key: "title"
          path: "$"
          name: "包含 title 字段"
        
        - type: contains_key
          key: "body"
          path: "$"
          name: "包含 body 字段"
        
        - type: equal
          path: "id"
          expected: 1
          name: "文章 ID 为 1"

# 测试场景 2: 创建文章
- name: "创建新文章"
  description: "测试 POST /posts 接口，验证创建功能"
  
  steps:
    - name: "创建文章"
      method: POST
      endpoint: "https://jsonplaceholder.typicode.com/posts"
      json:
        title: "API 自动化测试文章"
        body: "这是一篇通过 API 自动创建的测试文章"
        userId: 1
      
      headers:
        Content-Type: "application/json"
      
      assertions:
        - type: status_code
          expected: 201
          name: "创建成功，返回 201"
        
        - type: contains_key
          key: "id"
          path: "$"
          name: "返回文章 ID"
        
        - type: equal
          path: "title"
          expected: "API 自动化测试文章"
          name: "标题匹配"
        
        - type: equal
          path: "userId"
          expected: 1
          name: "用户 ID 匹配"

# 测试场景 3: 更新文章
- name: "更新文章"
  description: "测试 PUT /posts/{id} 接口"
  
  steps:
    - name: "完全更新文章"
      method: PUT
      endpoint: "https://jsonplaceholder.typicode.com/posts/1"
      json:
        id: 1
        title: "已更新的文章标题"
        body: "这是更新后的文章内容"
        userId: 1
      
      assertions:
        - type: status_code
          expected: 200
          name: "更新成功"
        
        - type: equal
          path: "title"
          expected: "已更新的文章标题"
          name: "标题已更新"
    
    - name: "部分更新文章 (PATCH)"
      method: PATCH
      endpoint: "https://jsonplaceholder.typicode.com/posts/1"
      json:
        title: "使用 PATCH 方法更新"
      
      assertions:
        - type: status_code
          expected: 200
        
        - type: equal
          path: "title"
          expected: "使用 PATCH 方法更新"

# 测试场景 4: 删除文章
- name: "删除文章"
  description: "测试 DELETE /posts/{id} 接口"
  
  steps:
    - name: "删除文章"
      method: DELETE
      endpoint: "https://jsonplaceholder.typicode.com/posts/1"
      
      assertions:
        - type: status_code
          expected: 200
          name: "删除成功返回 200"

# 测试场景 5: 评论操作
- name: "文章评论管理"
  description: "测试文章相关的评论接口"
  
  steps:
    # 获取某篇文章的评论
    - name: "获取文章评论"
      method: GET
      endpoint: "https://jsonplaceholder.typicode.com/posts/1/comments"
      
      assertions:
        - type: status_code
          expected: 200
        - type: type_check
          path: "$"
          expected_type: list
        - type: length
          path: "$"
          expected: 5
          name: "第一篇文章有 5 条评论"
    
    # 根据 ID 获取评论
    - name: "获取指定评论"
      method: GET
      endpoint: "https://jsonplaceholder.typicode.com/comments/1"
      params:
        postId: 1
      
      assertions:
        - type: status_code
          expected: 200
        - type: equal
          path: "postId"
          expected: 1
          name: "评论属于文章 1"
        - type: equal
          path: "id"
          expected: 1

# 测试场景 6: 用户和相册
- name: "用户相关资源"
  description: "测试用户、相册等关联资源"
  
  steps:
    # 获取所有用户
    - name: "获取用户列表"
      method: GET
      endpoint: "https://jsonplaceholder.typicode.com/users"
      
      assertions:
        - type: status_code
          expected: 200
        - type: length
          path: "$"
          expected: 10
    
    # 获取特定用户的相册
    - name: "获取用户相册"
      method: GET
      endpoint: "https://jsonplaceholder.typicode.com/users/1/albums"
      
      assertions:
        - type: status_code
          expected: 200
        - type: type_check
          path: "$"
          expected_type: list
        - type: contains_key
          key: "userId"
          path: "[0]"
          name: "相册包含 userId"
    
    # 错误处理：不存在的资源
    - name: "获取不存在的文章"
      method: GET
      endpoint: "https://jsonplaceholder.typicode.com/posts/999999"
      
      assertions:
        - type: status_code
          expected: 404
          name: "不存在的资源返回 404"
