# 断言增强示例 - JSON Schema / Custom / Database
# 演示 v2.0 新增的断言类型

name: "断言增强使用示例"
description: "展示 JSON Schema、自定义断言和数据库断言"

# ========================================
# 示例 1: JSON Schema 断言
# ========================================
json_schema_example:
  name: "验证用户列表响应结构"
  description: "使用 JSON Schema 验证 API 响应体结构"
  
  steps:
    - name: "获取用户列表"
      method: "GET"
      endpoint: "/users"
      assertions:
        - type: "status_code"
          expected: 200
        
        - type: "json_schema"
          name: "验证用户列表结构"
          schema:
            type: "object"
            required: ["users", "total", "page"]
            properties:
              users:
                type: "array"
                minItems: 1
                items:
                  type: "object"
                  required: ["id", "name", "email"]
                  properties:
                    id:
                      type: "integer"
                      minimum: 1
                    name:
                      type: "string"
                      minLength: 1
                      maxLength: 100
                    email:
                      type: "string"
                      pattern: "^[\\w.-]+@[\\w.-]+\\.\\w+$"
                    age:
                      type: "integer"
                      minimum: 0
                      maximum: 150
                    role:
                      type: "string"
                      enum: ["admin", "user", "moderator"]
                    is_active:
                      type: "boolean"
                    tags:
                      type: "array"
                      items:
                        type: "string"
                    profile:
                      type: "object"
                      properties:
                        bio:
                          type: "string"
                        avatar_url:
                          type: "string"
              total:
                type: "integer"
                minimum: 0
              page:
                type: "integer"
                minimum: 1

# ========================================
# 示例 2: 自定义断言 - Python 脚本
# ========================================
custom_assertion_example:
  name: "自定义业务逻辑断言"
  description: "使用自定义 Python 脚本实现复杂的业务逻辑检查"
  
  steps:
    - name: "验证响应数据业务规则"
      method: "GET"
      endpoint: "/api/products/featured"
      assertions:
        - type: "status_code"
          expected: 200
        
        - type: "custom"
          name: "检查产品价格范围"
          path: "$"
          script: |
            # 自定义断言脚本
            # 可用变量：response (整个响应体), value (path 提取的值)
            
            products = value.get("products", [])
            
            # 检查所有产品价格在有效范围内
            invalid_products = [
                p for p in products 
                if not (0 < p.get("price", 0) <= 10000)
            ]
            
            if invalid_products:
                result = (False, f"发现 {len(invalid_products)} 个产品价格超出范围")
            else:
                result = (True, "所有产品价格均在有效范围内")
        
        - type: "custom"
          name: "检查折扣逻辑"
          path: "$"
          script: |
            # 检查有折扣的产品必须也有原价
            products = value.get("products", [])
            
            for product in products:
                if product.get("discount"):
                    if not product.get("original_price"):
                        result = (False, f"产品 {product.get('name')} 有折扣但缺少原价")
                        break
            else:
                result = (True, "折扣逻辑验证通过")

# ========================================
# 示例 3: 数据库断言
# ========================================
database_assertion_example:
  name: "数据库查询结果验证"
  description: "验证 API 操作后的数据库状态"
  
  # 注意：数据库断言需要在测试运行器中注入查询结果
  # 可以通过钩子或自定义代码执行 SQL 查询
  steps:
    - name: "创建用户并验证数据库"
      method: "POST"
      endpoint: "/users"
      json:
        name: "测试用户"
        email: "test@example.com"
      assertions:
        - type: "status_code"
          expected: 201
        
        - type: "database"
          name: "验证用户已插入数据库"
          query_result: "[{'id': 1, 'name': '测试用户', 'email': 'test@example.com'}]"
          expected_rows: 1
          expected_value: "test@example.com"
          path: "$[0].email"

# ========================================
# 示例 4: 组合多种断言
# ========================================
combined_assertions_example:
  name: "组合使用多种断言类型"
  description: "展示如何在一个步骤中组合使用多种断言"
  
  steps:
    - name: "完整验证用户创建响应"
      method: "POST"
      endpoint: "/users"
      json:
        name: "张三"
        email: "zhangsan@example.com"
        age: 25
        role: "user"
      assertions:
        # HTTP 层断言
        - type: "status_code"
          expected: 201
        
        - type: "response_time"
          max: 1.0
        
        # JSON Schema 断言
        - type: "json_schema"
          name: "验证响应结构"
          schema:
            type: "object"
            required: ["id", "name", "email", "created_at"]
            properties:
              id:
                type: "integer"
              name:
                type: "string"
              email:
                type: "string"
              created_at:
                type: "string"
        
        # 值断言
        - type: "equal"
          path: "name"
          expected: "张三"
        
        - type: "contains_key"
          path: "$"
          key: "id"
        
        # 自定义断言
        - type: "custom"
          name: "验证 ID 为正数"
          path: "id"
          script: |
            if value > 0:
                result = (True, "ID 为正数")
            else:
                result = (False, "ID 不是正数")

# ========================================
# CLI 使用方式
# ========================================
cli_usage: |
  # 运行包含 JSON Schema 断言的测试
  python api_test_agent.py run examples/v2_assertions/json_schema_example.yaml
  
  # 运行包含自定义断言的测试
  python api_test_agent.py run examples/v2_assertions/custom_assertion_example.yaml
  
  # 运行所有断言示例
  python api_test_agent.py run examples/v2_assertions/
